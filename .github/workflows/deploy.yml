name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            cd /www/wwwroot/spp-sekolah

            echo "==> Pulling latest code from main..."
            git fetch origin
            git checkout main
            git pull origin main

            echo "==> Installing dependencies..."
            npm ci --prefer-offline --no-audit --no-fund

            echo "==> Running Prisma migrations..."
            migrate_log="$(mktemp)"
            if ! npx prisma migrate deploy 2>&1 | tee "$migrate_log"; then
              if grep -q "P3005" "$migrate_log"; then
                echo "==> Existing database detected without Prisma migration history. Baselining migrations..."
                npx prisma migrate resolve --applied 20260706134046_init
                npx prisma migrate resolve --applied 20260725180000_payment_category_code_string
                npx prisma migrate deploy
              else
                exit 1
              fi
            fi

            echo "==> Building app..."
            npm run build

            echo "==> Restarting PM2..."
            pm2 reload spp-sekolah --update-env

            echo "==> Done!"
            pm2 show spp-sekolah
