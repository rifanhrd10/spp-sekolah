name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e

            cd /www/wwwroot/spp-sekolah

            echo "==> Pulling latest code from staging..."
            git fetch origin
            git checkout staging
            git pull origin staging

            echo "==> Installing dependencies..."
            npm ci --prefer-offline

            echo "==> Running Prisma migrations..."
            # Baseline migration init jika belum ada di _prisma_migrations
            MIGRATION_EXISTS=$(npx prisma migrate status 2>&1 | grep "20260706134046_init" | grep -v "Not applied" | wc -l)
            if [ "$MIGRATION_EXISTS" -eq "0" ]; then
              echo "==> Baselining init migration..."
              npx prisma migrate resolve --applied "20260706134046_init"
            fi
            npx prisma migrate deploy

            echo "==> Building app..."
            npm run build

            echo "==> Restarting PM2..."
            pm2 reload spp-sekolah --update-env

            echo "==> Done!"
            pm2 show spp-sekolah
